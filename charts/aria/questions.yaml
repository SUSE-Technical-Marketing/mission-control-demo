questions:
  - question: "Global Image Registry"
    type: "string"
    label: "Global Image Registry"
    variable: "global.imageRegistry"
    default: "docker.io/library"
    help: "The global image registry to use for all images. If left empty, the default Docker Hub registry will be used."
  - question: "What is the host name for the ARIA ingress?"
    type: "string"
    label: "ARIA Ingress Host"
    variable: "ingress.host"
    default: "aria.example.com"
    help: "The host name used to access ARIA via the ingress."
  - question: "Nginx Image"
    type: "string"
    label: "Nginx Image"
    variable: "ui.image.repository"
    default: "nginx"
    help: "The Docker image for the Nginx server."
  - question: "Nginx Image Tag"
    type: "string"
    label: "Nginx Image Tag"
    variable: "ui.image.tag"
    default: "latest"
    help: "The Docker image tag for the Nginx server."
  - question: "NodeJS Image"
    type: "string"
    label: "NodeJS Image"
    variable: "api.image.repository"
    default: "node:latest"
    help: "The Docker image for the NodeJS API server."
  - question: "NodeJS Image Tag"
    type: "string"
    label: "NodeJS Image Tag"
    variable: "api.image.tag"
    default: "latest"
    help: "The Docker image tag for the NodeJS API server."
  - question: "Image Pull Secret"
    type: "string"
    label: "Image Pull Secret"
    variable: "appco.pullSecret"
    default: ""
    help: "A (pre-existing) image pull secret for accessing private Docker registries."
